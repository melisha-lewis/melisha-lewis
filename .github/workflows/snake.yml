name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: melisha-lewis
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#22D3EE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6
            dist/github-contribution-grid-snake.gif?color_snake=#22D3EE&color_dots=#0B1120,#172554,#1D4ED8,#2563EB,#22D3EE

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
